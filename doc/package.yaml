    title: "[responder] the reply jitter sleeps inline, capping a responder at about four queries a second"
    issue: pending
    fingerprint: 199784c7
  - id: DISC-010
    severity: S4
    type: bug
    title: "[responder] stop() raises RuntimeError when the responder was never started"
    issue: pending
