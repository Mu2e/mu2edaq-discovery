# Build configuration only. All package metadata lives in setup.cfg so that
# this package builds on the AlmaLinux 9 production platform, whose stock venv
# toolchain is setuptools 53 -- too old for a PEP 621 [project] table, which
# needs setuptools >= 61. See the header comment in setup.cfg before moving
# any of it back here.

[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"
