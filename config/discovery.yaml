# Default settings for mu2edaq-discovery tools.
# Precedence: command line > environment (MU2EDAQ_DISCOVERY_*) > this file > built-in defaults.
discovery:
  group: 239.255.42.99   # administratively-scoped multicast group
  port: 28999            # UDP port (queries and announcements)
  timeout: 2.0           # seconds a query waits for replies
  interval: 10.0         # GUI auto-probe interval in seconds
  # The query is also broadcast, because IGMP snooping without a querier (as
  # on the Mu2e DAQ VLAN) confines multicast to one switch while broadcast
  # floods the whole subnet.  A list of addresses, or false for multicast only.
  broadcast: [255.255.255.255]
