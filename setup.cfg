# Declarative metadata, deliberately in setup.cfg rather than as a PEP 621
# [project] table in pyproject.toml.
#
# The production platform is AlmaLinux 9, whose system Python 3.9 creates venvs
# with setuptools 53. PEP 621 [project] support only landed in setuptools 61,
# so a [project] table builds as "UNKNOWN" there -- no name, no version, no
# modules. setup.cfg has been read by setuptools since 30.3, so this form
# builds correctly on both the AL9 stock toolchain and current setuptools.
#
# Keep this the single source of truth: do NOT add a [project] table to
# pyproject.toml, or setuptools >= 61 will prefer it and the two will drift.

[metadata]
name = mu2edaq-discovery
version = 1.0.0
description = UDP multicast service discovery protocol and library for Mu2e DAQ applications
long_description = file: README.md
long_description_content_type = text/markdown
author = Mu2e DAQ Group
license = BSD-3-Clause
license_files = LICENSE
url = https://github.com/Mu2e/mu2edaq-discovery
project_urls =
    Repository = https://github.com/Mu2e/mu2edaq-discovery
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: BSD License
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Topic :: System :: Networking

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
mu2edaq_discovery =
    assets/*.png

[options.extras_require]
dev =
    pytest
yaml =
    PyYAML
gui =
    PyQt6

[options.entry_points]
console_scripts =
    mu2edaq-discover = mu2edaq_discovery.cli:main
gui_scripts =
    mu2edaq-discover-gui = mu2edaq_discovery.gui:main
